# Local development profile — active by default when SPRING_PROFILES_ACTIVE is unset.
# All secrets fall back to values matching compose.yaml so `./mvnw spring-boot:run` works
# out of the box. Override any of them via a local .env file (see .env.example).
spring:
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/mydatabase}
    username: ${DATABASE_USERNAME:user}
    password: ${DATABASE_PASSWORD:secret}

  jpa:
    show-sql: true
    properties:
      hibernate:
        generate_statistics: true

jwt:
  secret: ${JWT_SECRET:JXxKmFdpauSV1waI+6H3s/7RPLZ7Y0ZxGQ7yUZQLBTOnN2ponZxRkEkzfAJ7jpEInWh36txAWkG+1gT/DQiJPg==}
  expiration: ${JWT_EXPIRATION:86400000}

logging:
  level:
    org.hibernate.stat: DEBUG

management:
  endpoint:
    health:
      show-details: always
      show-components: always
