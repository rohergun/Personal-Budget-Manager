<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Register — BudgetManager</title>
    <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
            rel="stylesheet"
    />
    <link href="/css/style.css" rel="stylesheet" />
</head>
<body class="bg-light">

<div class="auth-card">
    <div class="auth-box">
        <h1>Register</h1>
        <p class="subtitle">create your account</p>

        <div id="errorAlert" class="alert alert-danger py-2 d-none" role="alert"></div>

        <form id="registerForm">
            <div class="mb-3">
                <label for="name" class="visually-hidden">Name</label>
                <input type="text" class="form-control" id="name" placeholder="First name" required />
            </div>
            <div class="mb-3">
                <label for="surname" class="visually-hidden">Surname</label>
                <input type="text" class="form-control" id="surname" placeholder="Last name" required />
            </div>
            <div class="mb-3">
                <label for="email" class="visually-hidden">Email</label>
                <input
                        type="email"
                        class="form-control"
                        id="email"
                        placeholder="you@example.com"
                        required
                />
            </div>
            <div class="mb-4">
                <label for="password" class="visually-hidden">Password</label>
                <input
                        type="password"
                        class="form-control"
                        id="password"
                        placeholder="Password"
                        required
                        minlength="8"
                />
            </div>
            <button type="submit" class="btn btn-primary w-100">Continue</button>
        </form>

        <p class="text-center mt-4 mb-0 small text-muted">
            Already have an account? <a href="/login.html" class="fw-semibold">Log In</a>
            <br>
            <a href="/index.html" class="fw-semibold">Go back to home page</a>
        </p>
    </div>
</div>

<script type="module" src="/js/register.js"></script>
</body>
</html>
