<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Dashboard — BudgetManager</title>
    <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
            rel="stylesheet"
    />
    <link href="/css/style.css" rel="stylesheet" />
</head>
<body class="bg-light" style="display: block; min-height: 100vh;">

<nav class="navbar navbar-light bg-white border-bottom">
    <div class="container">
        <span class="navbar-brand mb-0 fw-semibold">BudgetManager</span>
        <button id="logoutBtn" class="btn btn-outline-secondary btn-sm">Log out</button>
    </div>
</nav>

<div class="container" style="max-width: 700px;" >
    <p class="text-muted mb-1 mt-4">Welcome back</p>
    <h1 class="mb-4" id="userName">&nbsp;</h1>

    <div id="errorAlert" class="alert alert-danger d-none" role="alert"></div>

    <div class="row g-3 mb-4">
        <div class="col-4">
            <div class="bg-white rounded-3 p-3">
                <p class="text-muted small mb-1">Income this month</p>
                <p class="fs-4 fw-medium mb-0" id="totalIncome">—</p>
            </div>
        </div>
        <div class="col-4">
            <div class="bg-white rounded-3 p-3">
                <p class="text-muted small mb-1">Expenses this month</p>
                <p class="fs-4 fw-medium mb-0" id="totalExpenses">—</p>
            </div>
        </div>
        <div class="col-4">
            <div class="bg-white rounded-3 p-3">
                <p class="text-muted small mb-1">Net</p>
                <p class="fs-4 fw-medium mb-0" id="net">—</p>
            </div>
        </div>
    </div>

    <div class="card shadow-sm">
        <div class="card-body">
            <p class="fw-semibold mb-3">Spending by category</p>
            <div id="categoryList">
                <p class="text-muted small mb-0">Loading…</p>
            </div>
        </div>
    </div>
</div>

<script type="module" src="/js/dashboard.js"></script>
</body>
</html>
