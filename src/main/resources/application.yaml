spring:
  application:
    name: BudgetManager

  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

  cache:
    type: caffeine

  datasource:
    driver-class-name: org.postgresql.Driver

  flyway:
    baseline-on-migrate: true
    baseline-version: 1

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

management:
  endpoints:
    web:
      exposure:
        include: health, info

info:
  app:
    name: BudgetManager
    description: Personal finance management API
  build:
    version: 1.0.0
