spring:
  application:
    name: BudgetManager

  cache:
    type: caffeine

  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/mydatabase}
    username: ${DATABASE_USERNAME:user}
    password: ${DATABASE_PASSWORD:secret}
    driver-class-name: org.postgresql.Driver

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        generate_statistics: true

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

jwt:
  secret: ${JWT_SECRET:JXxKmFdpauSV1waI+6H3s/7RPLZ7Y0ZxGQ7yUZQLBTOnN2ponZxRkEkzfAJ7jpEInWh36txAWkG+1gT/DQiJPg==}
  expiration: ${JWT_EXPIRATION:86400000}

logging:
  level:
    org.hibernate.stat: DEBUG

management:
  endpoints:
    web:
     exposure:
       include: health, info
  endpoint:
    health:
      show-details: always

info:
  app:
    name: BudgetManager
    description: Personal finance management API
  build:
    version: 1.0.0